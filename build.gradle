plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.runetags.RuneTagsLauncher'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation 'org.mockito:mockito-core:4.11.0'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.runetags'
version = '1.0.1'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

/*
 * RUN RUNETAGS
 */

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

/*
 * TEST TASKS
 */

tasks.withType(Test).configureEach {
	testLogging {
		showStandardStreams = true
	}
}

tasks.register('testAll') {
	group = 'verification'
	description = 'Runs all RuneTags deterministic test suites.'

	dependsOn(
			'testChat',
			'testConfig',
			'testContext',
			'testHiscores',
			'testHistory',
			'testInput',
			'testLocation',
			'testMention',
			'testNotification',
			'testPlayer',
			'testQuickProfile',
			'testRecords',
			'testReports',
			'testSuggestion',
			'testTarget'
	)
}

tasks.register('testChat', Test) {
	group = 'verification'
	description = 'Tests RuneTags chat processing, formatting, layout, interaction, bootstrap, and message retention.'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	useJUnit()

	filter {
		includeTestsMatching 'com.runetags.chat.TaggedMessageRepositoryTest'
		includeTestsMatching 'com.runetags.chat.MessageMarkupMapTest'
		includeTestsMatching 'com.runetags.chat.ChatTextTest'
		includeTestsMatching 'com.runetags.chat.ChatProcessorTest'
		includeTestsMatching 'com.runetags.chat.ChatInteractionPolicyTest'
		includeTestsMatching 'com.runetags.chat.ChatHitboxRegistryTest'
		includeTestsMatching 'com.runetags.chat.MessageFormatterTest'
		includeTestsMatching 'com.runetags.chat.NativeBootstrapServiceTest'
		includeTestsMatching 'com.runetags.chat.ReferenceLayoutServiceTest'
		includeTestsMatching 'com.runetags.chat.FontLayoutServiceTest'
	}

	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}

